# CONFIG_BSP_UART1_RX_USING_DMA is not set
# CONFIG_BSP_ENABLE_AUD_PRC is not set
# CONFIG_BSP_ENABLE_AUD_CODEC is not set
# CONFIG_BSP_USING_TOUCHD is not set
# CONFIG_BSP_USING_KEY1 is not set
# CONFIG_BSP_USING_LED1 is not set
CONFIG_RT_USING_MEMHEAP=y
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_BSP_USING_I2C=y
CONFIG_BSP_USING_I2C1=y
CONFIG_PKG_USING_CAMERA_FRAMEWORK=y
# CONFIG_SENSOR_USING_OV2640 is not set
CONFIG_SENSOR_USING_GC032A=y
CONFIG_CAMERA_GC032A_INTERFACE_SERIAL_2BIT=y
# The board owns the camera I2C device name and the MCLK/PWM wiring.
CONFIG_CAMERA_I2C_DEVICE_NAME="i2c1"
CONFIG_CAMERA_XCLK_ENABLE=y
CONFIG_CAMERA_XCLK_PWM_DEVICE_NAME="pwmt2"
CONFIG_CAMERA_XCLK_PWM_CHANNEL=1
